name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (generic, JSON, skills, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/lint.sh
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}

  smoke-bash:
    name: bash scripts smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/smoke-json.sh
      - name: Hide jq (the bash scripts must not need it)
        run: |
          sudo mv "$(command -v jq)" "$RUNNER_TEMP/jq.hidden"
          if command -v jq; then echo "jq is still on the PATH"; exit 1; fi
      - run: bash tests/smoke-slot.sh
      - run: bash tests/smoke-render.sh
      - run: bash tests/smoke-hook.sh
      - run: bash tests/smoke-release.sh
      - run: bash tests/smoke-validate.sh
      - run: bash tests/smoke-status.sh
      - run: bash tests/smoke-template-board.sh

  smoke-powershell:
    name: PowerShell scripts smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-slot.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-render.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-hook.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-release.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-validate.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-status.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke-template-board.ps1

  validate:
    name: claude plugin validate (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
