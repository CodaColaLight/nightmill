name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: Lint (generic, JSON, skills, shell)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/lint.sh
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}

  smoke-bash:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: bash scripts smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/smoke-json.sh
      - name: Hide jq (the bash scripts must not need it)
        run: |
          sudo mv "$(command -v jq)" "$RUNNER_TEMP/jq.hidden"
          if command -v jq; then echo "jq is still on the PATH"; exit 1; fi
      - run: bash tests/check.sh --only smoke-hook.sh,smoke-release.sh,smoke-slot.sh,smoke-render.sh,smoke-validate.sh,smoke-status.sh,smoke-template-board.sh,smoke-models.sh,smoke-load.sh,smoke-room.sh,smoke-control.sh,smoke-dashboard.sh,smoke-panel.sh,smoke-stages.sh,smoke-check.sh,test-lintcopy-output.sh,test-lint-pipefail.sh,test-release-resume.sh,test-json-bom.sh,test-render-quoting.sh,test-changelog-refs.sh,test-check-skill.sh,test-status-controls.sh,test-worker-merge.sh,test-script-modes.sh,test-fix-pick.sh,test-changelog-coverage.sh,test-json-speed.sh,test-mktemp-template.sh

  smoke-powershell:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: PowerShell scripts smoke tests
    runs-on: windows-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: bash tests/check.sh --powershell powershell --only smoke-slot.ps1,smoke-render.ps1,smoke-hook.ps1,smoke-release.ps1,smoke-validate.ps1,smoke-status.ps1,smoke-template-board.ps1,smoke-models.ps1,smoke-load.ps1,smoke-room.ps1,smoke-control.ps1,smoke-dashboard.ps1,smoke-panel.ps1,smoke-stages.ps1,smoke-check.ps1,test-lintcopy-output.ps1,test-release-resume.ps1,test-json-bom.ps1,test-render-quoting.ps1,test-status-controls.ps1

  validate:
    name: claude plugin validate (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin test .
