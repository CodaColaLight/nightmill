name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: Lint (generic, JSON, skills, shell)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/lint.sh
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}

  smoke-bash:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: bash scripts smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/smoke-json.sh
      - name: Hide jq (the bash scripts must not need it)
        run: |
          sudo mv "$(command -v jq)" "$RUNNER_TEMP/jq.hidden"
          if command -v jq; then echo "jq is still on the PATH"; exit 1; fi
      - run: bash tests/check.sh --summary "$GITHUB_STEP_SUMMARY" --only smoke-hook.sh,smoke-release.sh,smoke-slot.sh,smoke-render.sh,smoke-validate.sh,smoke-status.sh,smoke-template-board.sh,smoke-models.sh,smoke-load.sh,smoke-room.sh,smoke-control.sh,smoke-dashboard.sh,smoke-panel.sh,smoke-stages.sh,smoke-check.sh,test-lintcopy-output.sh,test-lint-pipefail.sh,test-release-resume.sh,test-json-bom.sh,test-render-quoting.sh,test-changelog-refs.sh,test-check-skill.sh,test-status-controls.sh,test-worker-merge.sh,test-script-modes.sh,test-fix-pick.sh,test-changelog-coverage.sh,test-json-speed.sh,test-mktemp-template.sh,test-skill-config-fallback.sh,test-slot-number.sh,test-board-listing.sh,test-resume-stuck.sh,test-story-dedup.sh,test-interrupt-docs.sh,test-spec-template.sh,smoke-guard.sh,test-watch-checks.sh,test-guard-rules.sh,smoke-drive.sh,smoke-gate.sh,smoke-history.sh,test-ci-summary.sh,test-baseconfig-pathconv.sh,test-restricted-path-git.sh

  smoke-powershell-part:
    # The PowerShell smoke steps in parts, one runner each (iteration 55). Not a required check: the job
    # smoke-powershell below carries the required name and fails unless every part succeeded.
    name: PowerShell smoke part ${{ matrix.part }} of 4
    runs-on: windows-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            only: smoke-slot.ps1
          - part: 2
            only: smoke-render.ps1,smoke-release.ps1,smoke-status.ps1,smoke-dashboard.ps1,test-release-resume.ps1,test-json-bom.ps1,smoke-drive.ps1
          - part: 3
            only: smoke-hook.ps1,smoke-validate.ps1,smoke-control.ps1,smoke-panel.ps1,smoke-check.ps1,test-render-quoting.ps1,smoke-gate.ps1
          - part: 4
            only: smoke-template-board.ps1,smoke-models.ps1,smoke-load.ps1,smoke-room.ps1,smoke-stages.ps1,test-lintcopy-output.ps1,test-status-controls.ps1,test-smoke-slot-tar.ps1,smoke-guard.ps1,smoke-history.ps1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: bash tests/check.sh --powershell powershell --summary "$GITHUB_STEP_SUMMARY" --only ${{ matrix.only }}

  smoke-powershell:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: PowerShell scripts smoke tests
    needs: smoke-powershell-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one job-level permissions block (iteration 55 decision 11): the job times need actions: read.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every part succeeded
        env:
          PARTS: ${{ needs.smoke-powershell-part.result }}
        run: |
          echo "the PowerShell parts: $PARTS"
          [ "$PARTS" = success ] || { echo "FAIL: a PowerShell part did not succeed ($PARTS)"; exit 1; }
      - name: Job times
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | (["job", .name, (.conclusion // .status), (.started_at // ""), (.completed_at // "")] | @tsv),
                  (.name as $j | .steps[]? | ["step", $j, .name, (.started_at // ""), (.completed_at // "")] | @tsv)' \
            | bash tests/ci-jobs-summary.sh --parts 'PowerShell smoke part ' --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: claude plugin validate (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin test .
