name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CHECK_SELECT: ${{ github.event_name == 'pull_request' && '--affected --within' || '--only' }}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: Lint (generic, JSON, skills, shell)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/lint.sh
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}

  smoke-bash:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: bash scripts smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash tests/check.sh --summary "$GITHUB_STEP_SUMMARY" $CHECK_SELECT @with-jq
      - name: Hide jq (the bash scripts must not need it)
        run: |
          sudo mv "$(command -v jq)" "$RUNNER_TEMP/jq.hidden"
          if command -v jq; then echo "jq is still on the PATH"; exit 1; fi
      - run: bash tests/check.sh --summary "$GITHUB_STEP_SUMMARY" $CHECK_SELECT @without-jq

  smoke-gitbash-part:
    # The bash steps in Git Bash on Windows runners, in parts (iterations 64, 66 and 69; decision record 0004); the
    # job smoke-gitbash below carries the required name and fails unless every part succeeded.
    name: Git Bash smoke part ${{ matrix.part }} of 7
    runs-on: windows-latest
    timeout-minutes: 51
    strategy:
      fail-fast: false
      matrix:
        # Part <k> runs the group @gitbash-<k> of tests/check.sh: its steps marked alone, one part each, then the rest.
        part: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: bash
        run: bash tests/check.sh --summary "$GITHUB_STEP_SUMMARY" $CHECK_SELECT @gitbash-${{ matrix.part }}

  smoke-gitbash:
    # Required check: the ruleset on main requires this name; renaming it blocks every pull request.
    name: Git Bash scripts smoke tests
    needs: smoke-gitbash-part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one job-level permissions block (iteration 55 decision 11): the job times need actions: read.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every Git Bash part succeeded
        env:
          PARTS: ${{ needs.smoke-gitbash-part.result }}
        run: |
          echo "the Git Bash parts: $PARTS"
          [ "$PARTS" = success ] || { echo "FAIL: a Git Bash part did not succeed ($PARTS)"; exit 1; }
      - name: Job times
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | (["job", .name, (.conclusion // .status), (.started_at // ""), (.completed_at // "")] | @tsv),
                  (.name as $j | .steps[]? | ["step", $j, .name, (.started_at // ""), (.completed_at // "")] | @tsv)' \
            | bash tests/ci-jobs-summary.sh --parts 'Git Bash smoke part ' --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: claude plugin validate (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin test .
