name: Story
description: One shippable slice of a feature (one spec, one PR)
title: "[Story] "
labels: ["story", "needs-spec"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [skills, scripts, templates, schema, docs, ci]
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Epic
      description: "#number of the parent epic"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now. Link prior specs and decisions instead of repeating them.
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: Goal
      description: One sentence a user would understand.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkbox list. Each line must be testable and will become a test name. No numbers here; numbers go in the spec.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants this story must respect
      options:
        - label: "Generic — no word from tests/forbidden-words.txt anywhere in the repository"
          required: false
        - label: "Fixed flow — the eight statuses and who sets them change only with a decision record"
          required: false
        - label: "Both shells — every script exists in PowerShell and bash and behaves the same"
          required: false
        - label: "Config-driven — a project-specific value lives in .claude/nightmill.json, never in a skill or script"
          required: false
        - label: "Compatible — slot markers and config keys stay readable by the previous version"
          required: false
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What to run and what to look at. Default below.
      value: |
        - `bash tests/check.sh` green
        - Run the changed skill in a real project with `claude --plugin-dir <this checkout>` and watch it take the right steps
  - type: textarea
    id: agent_notes
    attributes:
      label: Agent notes
      description: Files likely touched, known gotchas, related issues.
